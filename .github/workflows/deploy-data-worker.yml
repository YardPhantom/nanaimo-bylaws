name: Deploy Nanaimo data Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/worker/**"
      - ".github/workflows/deploy-data-worker.yml"

permissions:
  contents: read

concurrency:
  group: nanaimo-data-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Validate Cloudflare configuration
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Deploy Worker with pinned Wrangler
        working-directory: cloud/worker
        run: npx --yes wrangler@4.114.0 deploy
