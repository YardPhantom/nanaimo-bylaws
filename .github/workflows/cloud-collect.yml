name: Collect and publish Nanaimo data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"
      timezone: "America/Vancouver"

permissions:
  contents: read

concurrency:
  group: nanaimo-cloud-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Validate R2 configuration
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install PDF and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Restore current cloud collection state
        run: python tools/cloud_sync.py pull

      - name: Collect bylaws, Council and committee records
        run: python tools/collect_all.py

      - name: Verify generated collection
        run: |
          python tools/deduplicate_archive.py --check
          python tools/verify_council_collection.py

      - name: Publish changed runtime files to R2
        run: python tools/cloud_sync.py publish

      - name: Verify required R2 objects
        run: python tools/cloud_sync.py verify

      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nanaimo-collection-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            collection-status.json
            archive-manifest.json
            data/*verification*.json
            data/*change-log*.json
            data/*progress*.json
